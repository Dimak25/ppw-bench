name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MinGW-w64 (gcc)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build benchmark
        shell: msys2 {0}
        run: gcc -O2 -static -Wall -Wextra bench.c -o bench.exe

      - name: Unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests

      - name: Smoke run (8 s, no power sensors on CI)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python ppw_bench.py --duration 8 --no-st --out ci-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppw-report-windows-py${{ matrix.python-version }}
          path: ci-report.txt
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is not available on new Ubuntu runners; Windows still covers 3.9
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build benchmark
        run: gcc -O2 -static -pthread -Wall -Wextra bench.c -o bench

      - name: Unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests

      - name: Smoke run (8 s, RAPL is not available on CI runners)
        run: |
          python ppw_bench.py --list
          python ppw_bench.py --duration 8 --cooldown 1 --out ci-report.txt
          cat ci-report.txt

      - name: Build tar.gz (no Nuitka)
        run: ./build-linux.sh --no-nuitka

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppw-report-linux-py${{ matrix.python-version }}
          path: ci-report.txt
          if-no-files-found: warn
