name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install MinGW-w64 (gcc)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build benchmark
        shell: msys2 {0}
        run: gcc -O2 -static bench.c -o bench.exe

      - name: Check tag matches version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          if (-not $tag) { throw "No release tag provided" }

          $src = Get-Content -LiteralPath ppw_bench.py -Raw -Encoding utf8
          if ($src -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Cannot read __version__ from ppw_bench.py"
          }
          $version = $Matches[1]
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match __version__ 'v$version'"
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing $tag (version $version)"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console `
            --name ppw-bench --distpath dist --workpath build/onedir `
            --add-binary "bench.exe;." ppw_bench.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build single-file exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name ppw-bench --distpath dist --workpath build/onefile `
            --add-binary "bench.exe;." ppw_bench.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test portable builds
        shell: pwsh
        run: |
          .\dist\ppw-bench\ppw-bench.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\ppw-bench.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\ppw-bench.exe --duration 8 --no-st --out ci-portable-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack release assets
        shell: pwsh
        run: |
          $stage = "dist/ppw-bench-$($env:TAG)-win64-portable"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "dist/ppw-bench/*" -Destination $stage -Recurse
          Copy-Item -LiteralPath "README.md", "README.en.md", "LICENSE" $stage
          Compress-Archive -LiteralPath $stage `
            -DestinationPath "dist/ppw-bench-$($env:TAG)-win64-portable.zip"

          $assets = @(
            "dist/ppw-bench.exe",
            "dist/ppw-bench-$($env:TAG)-win64-portable.zip"
          )
          $lines = foreach ($file in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PPW Bench ${{ env.TAG }}
          body: |
            ## Portable (Windows 10/11 x64)

            Python и gcc не нужны. Доступны два варианта:

            * `ppw-bench.exe` — один файл, удобнее всего.
            * `ppw-bench-*-win64-portable.zip` — папка с exe и `_internal`.
              **Рекомендуется, если антивирус жалуется на одиночный exe.**

            Запуск: двойной щелчок или `ppw-bench.exe --quick`. Отчёт
            `ppw-report-*.txt` сохраняется рядом с exe.

            > **Ложное срабатывание антивируса.** Одиночный exe собран
            > PyInstaller и не подписан. Эвристики (например, Microsoft Defender)
            > иногда определяют такие файлы как `Trojan:Win32/Wacatac.H!ml`.
            > Это ложное срабатывание: сверьте SHA256 с `SHA256SUMS.txt`,
            > используйте ZIP-вариант или отправьте файл в Microsoft как FP.

            ## Portable (Windows 10/11 x64) — English

            Python and gcc are not required. Two options:

            * `ppw-bench.exe` — a single file, the most convenient.
            * `ppw-bench-*-win64-portable.zip` — a folder with the exe and
              `_internal`. **Recommended if your antivirus flags the single exe.**

            Run it by double-clicking or with `ppw-bench.exe --quick`. The
            `ppw-report-*.txt` report is written next to the exe.

            > **Antivirus false positive.** The single-file exe is built with
            > PyInstaller and is unsigned. Heuristics (e.g. Microsoft Defender)
            > may flag it as `Trojan:Win32/Wacatac.H!ml`. This is a false
            > positive: verify SHA256 against `SHA256SUMS.txt`, use the ZIP
            > build, or submit the file to Microsoft as a false positive.
          files: |
            dist/ppw-bench.exe
            dist/ppw-bench-${{ env.TAG }}-win64-portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
