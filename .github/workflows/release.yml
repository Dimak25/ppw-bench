name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install MinGW-w64 (gcc)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build benchmark
        shell: msys2 {0}
        run: gcc -O2 -static bench.c -o bench.exe

      - name: Check tag matches version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          if (-not $tag) { throw "No release tag provided" }

          $src = Get-Content -LiteralPath ppwbench/__init__.py -Raw -Encoding utf8
          if ($src -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Cannot read __version__ from ppwbench/__init__.py"
          }
          $version = $Matches[1]
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match __version__ 'v$version'"
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing $tag (version $version)"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console `
            --name ppw-bench --distpath dist --workpath build/onedir `
            --add-binary "bench.exe;." ppw_bench.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build single-file exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name ppw-bench --distpath dist --workpath build/onefile `
            --add-binary "bench.exe;." ppw_bench.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test portable builds
        shell: pwsh
        run: |
          .\dist\ppw-bench\ppw-bench.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\ppw-bench.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\ppw-bench.exe --duration 8 --no-st --out ci-portable-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack release assets
        shell: pwsh
        run: |
          $stage = "dist/ppw-bench-$($env:TAG)-win64-portable"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "dist/ppw-bench/*" -Destination $stage -Recurse
          Copy-Item -LiteralPath "README.md", "README.en.md", "LICENSE" $stage
          Compress-Archive -LiteralPath $stage `
            -DestinationPath "dist/ppw-bench-$($env:TAG)-win64-portable.zip"

          $assets = @(
            "dist/ppw-bench.exe",
            "dist/ppw-bench-$($env:TAG)-win64-portable.zip"
          )
          $lines = foreach ($file in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -LiteralPath "dist/SHA256SUMS-windows.txt" -Encoding ascii

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/ppw-bench.exe
            dist/ppw-bench-${{ env.TAG }}-win64-portable.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error


  linux:
    # Built inside an Ubuntu 22.04 container (glibc 2.35) so the Nuitka binary
    # runs on Ubuntu 22.04+ / Debian 12+ / Fedora 36+, regardless of which
    # Ubuntu version ubuntu-latest currently is. bench itself is static.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential patchelf ca-certificates git \
            python3 python3-dev python3-pip python3-venv
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip nuitka zstandard
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Check tag matches version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ppwbench/__init__.py)
          [ "$TAG" = "v$VERSION" ] || { echo "Tag '$TAG' != v$VERSION"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build tar.gz and Nuitka onefile
        run: PYTHON=python ./build-linux.sh

      - name: Smoke test
        run: |
          ./dist/ppw-bench-${TAG}-linux-x86_64 --duration 8 --no-st --out ci-onefile.txt
          mkdir t && tar -C t -xzf dist/ppw-bench-${TAG}-linux-x86_64.tar.gz
          ./t/ppw-bench-${TAG}-linux-x86_64/ppw-bench --duration 8 --no-st --out ci-tar.txt

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/ppw-bench-${{ env.TAG }}-linux-x86_64
            dist/ppw-bench-${{ env.TAG }}-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        run: |
          cat dist/SHA256SUMS-windows.txt dist/SHA256SUMS-linux.txt > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PPW Bench ${{ env.TAG }}
          body: |
            ## Portable (Windows 10/11 x64)

            Python и gcc не нужны. Доступны два варианта:

            * `ppw-bench.exe` — один файл, удобнее всего.
            * `ppw-bench-*-win64-portable.zip` — папка с exe и `_internal`.
              **Рекомендуется, если антивирус жалуется на одиночный exe.**

            Запуск: двойной щелчок или `ppw-bench.exe --quick`. Отчёт
            `ppw-report-*.txt` сохраняется рядом с exe.

            > **Ложное срабатывание антивируса.** Одиночный exe собран
            > PyInstaller и не подписан. Эвристики (например, Microsoft Defender)
            > иногда определяют такие файлы как `Trojan:Win32/Wacatac.H!ml`.
            > Это ложное срабатывание: сверьте SHA256 с `SHA256SUMS.txt`,
            > используйте ZIP-вариант или отправьте файл в Microsoft как FP.

            ## Portable (Windows 10/11 x64) — English

            Python and gcc are not required. Two options:

            * `ppw-bench.exe` — a single file, the most convenient.
            * `ppw-bench-*-win64-portable.zip` — a folder with the exe and
              `_internal`. **Recommended if your antivirus flags the single exe.**

            Run it by double-clicking or with `ppw-bench.exe --quick`. The
            `ppw-report-*.txt` report is written next to the exe.

            > **Antivirus false positive.** The single-file exe is built with
            > PyInstaller and is unsigned. Heuristics (e.g. Microsoft Defender)
            > may flag it as `Trojan:Win32/Wacatac.H!ml`. This is a false
            > positive: verify SHA256 against `SHA256SUMS.txt`, use the ZIP
            > build, or submit the file to Microsoft as a false positive.

            ## Linux x86_64

            * `ppw-bench-*-linux-x86_64.tar.gz` — скрипт + статический `bench`,
              нужен только `python3` ≥ 3.9 (есть почти везде). Script + static
              `bench`; needs `python3` >= 3.9.
            * `ppw-bench-*-linux-x86_64` — самостоятельный бинарник (Nuitka),
              Python не нужен; glibc ≥ 2.35. Standalone binary, glibc >= 2.35.

            ```bash
            tar xzf ppw-bench-*-linux-x86_64.tar.gz && cd ppw-bench-*-linux-x86_64
            sudo ./ppw-bench --quick          # RAPL с ядра 5.10 читает только root
            sudo ./install-udev.sh            # или один раз: доступ без sudo
            ```
          files: |
            dist/ppw-bench.exe
            dist/ppw-bench-${{ env.TAG }}-win64-portable.zip
            dist/ppw-bench-${{ env.TAG }}-linux-x86_64
            dist/ppw-bench-${{ env.TAG }}-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
